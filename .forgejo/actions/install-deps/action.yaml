name: Install dependencies
description: Update and install system and python dependencies
runs:
  using: composite
  steps:
      - name: Update and install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install python3-pip ffmpeg libsm6 libxext6 bc -y
          python3 -m pip install -r ./requirements.txt pytest-cov --break-system-packages