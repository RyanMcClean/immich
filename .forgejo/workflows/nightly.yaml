name: Nightly Test + Coverage Badge
on: 
  schedule: 
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: debian-stable

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv
        with: 
          activate-environment: true

      - id: pytest
        name: Run tests
        continue-on-error: true
        run: |
          uv run pytest --cov=./ --cov-report=json --cov-report=html --cov-fail-under=0 --html=./docs/test-report.html --self-contained-html

      - name: Generate Coverage Badge
        uses: ./.forgejo/actions/coverage

      - name: Upload test-results
        uses: actions/upload-artifact@v3
        with:
          name: Test Results
          path: ./docs/test-report.html

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
