[project]
name = "immich-cli"
version = "0.0.1"
description = "A python based immich cli application"
readme = "README.md"
dependencies = [ "matplotlib", "opencv-python-headless", "rawpy", "requests", "requests-toolbelt", "tqdm", "numpy", "pydantic", "argcomplete" ]
requires-python = ">=3.12"

[[project.authors]]
name = "Ryan McClean"
email = "ryanmcclean@pm.me"

[project.optional-dependencies]
test = [ "pytest", "pytest-cov", "pytest-html" ]
dev = [ "flake8", "flake8-bugbear", "flake8-pyproject", "black" ]

[project.scripts]
immich-cli = "immich_cli.main:main"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/immich_cli" ]

[tool.pytest.ini_options]
pythonpath = [ ".", "src" ]
testpaths = [ "tests" ]
log_cli_level = "CRITICAL"
log_cli_format = "%(message)s"
log_file = "./test_logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

# Pyrefly header
[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/.[!/.]*", "**/tests"]
search-path = ["src"]
site-package-path = [".venv/lib/python3.12/site-packages"]

[tool.pyrefly.errors]
redefinition = "ignore"

[tool.black]
line-length = 100
target-version = [ "py312" ]
skip-string-normalization = false

[tool.flake8]
max-line-length = 100
extend-select = [ "B950" ]
extend-ignore = [ "E203", "E501", "E701", "B001", "E722", "E128", "E266", "E402", "F841" ]
per-file-ignores = []
extend-exclude = [ ".git", "__pycache__", ".forgejo", ".vscode", ".pytest_cache", "venv", ".venv", ".env", "env" ]
show-source = true
statistics = true
count = true
